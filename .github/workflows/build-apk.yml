name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reassemble split files and restore icons
        run: |
          cat assets/icon-512.png.b64.part-* > assets/icon-512.png.b64
          cat assets/icon-maskable-512.png.b64.part-* > assets/icon-maskable-512.png.b64
          for f in assets/*.png.b64; do
            base64 --decode "$f" > "${f%.b64}"
          done
          ls -la assets/

      - name: Prepare web folder for Capacitor
        run: |
          mkdir -p www
          cat index.html.part-0 index.html.part-1 > www/index.html
          cp -r assets www/assets
          rm -f www/assets/*.b64 www/assets/*.part-*

      - name: Install Capacitor and add Android platform
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Protidiner-Dua-Hadis-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
